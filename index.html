<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apps</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #16181d;
        --muted: #6b7280;
        --line: #e4e7ec;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111317;
          --card: #1a1d23;
          --text: #f2f4f7;
          --muted: #9aa2af;
          --line: #2a2f38;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", sans-serif;
      }
      main { width: 100%; max-width: 560px; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      p.sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
      a.card {
        display: block;
        padding: 18px 20px;
        margin-bottom: 12px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        text-decoration: none;
        color: inherit;
        transition: transform .12s ease, border-color .12s ease;
      }
      a.card:hover { transform: translateY(-2px); border-color: var(--muted); }
      a.card strong { display: block; font-size: 16px; margin-bottom: 2px; }
      a.card span { font-size: 13px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Apps</h1>
      <p class="sub">เลือกเว็บที่ต้องการเปิด</p>
      <a class="card" href="./day-pilot/">
        <strong>Day Pilot</strong>
        <span>วางแผนงานรายวัน</span>
      </a>
      <a class="card" href="./full-calendar/">
        <strong>ตารางนัดหมายแพทย์</strong>
        <span>ปฏิทินนัดหมายแบบเต็มเดือน</span>
      </a>
    </main>
  </body>
</html>
